    rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Brittany Signature';
      src: url('/fonts/BrittanySignature.woff') format('woff'),
        url('fonts/BrittanySignature.woff') format('woff'),
        url('https://fonts.cdnfonts.com/s/39082/BrittanySignature-LjyZ.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ivory: #fce4ec;
      --cream: #fce4ec;
      --blush: #fce4ec;
      --gold: #9e4a5d;
      --gold-soft: #e5b3be;
      --ink: #36262c;
      --mute: #755963;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --script: 'Alex Brush', 'Great Vibes', cursive;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    section {
      padding: clamp(44px, 8vw, 76px) 24px;
      text-align: center;
      position: relative
    }

    .wrap {
      max-width: 580px;
      margin: 0 auto
    }

    .label {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin: 0 0 20px
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0
    }

    .names {
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 5.2rem);
      line-height: 1.2;
      letter-spacing: .02em
    }

    .intro-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
      text-align: center;
      overflow: visible;
    }

    .script-line {
      position: relative;
      display: inline-block;
      line-height: 1.2;
      padding: 0.05em 0.8em;
      overflow: visible;
    }

    .script-text {
      display: inline-block;
      font-family: var(--script);
      font-size: clamp(3.2rem, 12.5vw, 5.2rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: .02em;
      white-space: nowrap;
      padding: 0.08em 0.3em;
      margin: -0.08em -0.3em;
      overflow: visible;
      will-change: clip-path, opacity;
    }

    .script-groom .script-text,
    .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .script-amp {
      overflow: visible;
    }

    .script-amp .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.6rem, 5.5vw, 2.3rem);
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      display: block;
      margin: 2px 0;
      transition: transform .6s ease;
    }

    .calligraphy-spark {
      position: absolute;
      top: 52%;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px #fff0f5, 0 0 16px 4px rgba(235, 175, 190, .95), 0 0 24px 6px rgba(212, 130, 150, .85);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      will-change: left, opacity;
    }

    .flourish-wrap {
      width: clamp(200px, 62vw, 300px);
      height: 24px;
      margin: .1rem auto 0;
      overflow: visible;
    }

    .calligraphy-flourish {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .intro-names.in .script-bride .script-text {
      animation: writeBride 1.5s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.5s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-amp .amp {
      animation: revealAmp .7s cubic-bezier(.34, 1.56, .64, 1) 1.6s forwards;
    }

    .intro-names.in .script-groom .script-text {
      animation: writeGroom 1.7s cubic-bezier(.35, 0, .25, 1) 2.1s forwards;
    }

    .intro-names.in .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.7s cubic-bezier(.35, 0, .25, 1) 2.1s forwards;
    }

    .intro-names.in .flourish-path {
      animation: drawFlourish 1.1s cubic-bezier(.25, 1, .5, 1) 3.6s forwards;
    }

    @keyframes writeGroom {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveGroom {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes revealAmp {
      0% {
        opacity: 0;
        transform: scale(.6) rotate(-8deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes writeBride {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveBride {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes drawFlourish {
      0% {
        stroke-dashoffset: 320;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .script-groom .script-text,
      .script-bride .script-text {
        clip-path: none !important;
        opacity: 1 !important;
        animation: none !important;
      }

      .script-amp .amp {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }

      .calligraphy-spark {
        display: none !important;
      }

      .flourish-path {
        stroke-dashoffset: 0 !important;
        animation: none !important;
      }
    }

    .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.5rem, 5vw, 2rem);
      display: block;
      margin: 6px 0
    }

    .big {
      font-size: clamp(2.3rem, 7vw, 3.2rem);
      line-height: 1.15
    }

    .quote {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.3rem, 4.6vw, 1.65rem);
      line-height: 1.6;
      max-width: 30ch;
      margin: 0 auto
    }

    .body {
      font-family: var(--serif);
      font-size: clamp(1.25rem, 4.4vw, 1.5rem);
      line-height: 1.7;
      max-width: 34ch;
      margin: 0 auto
    }

    .small {
      font-size: .85rem;
      color: var(--mute);
      letter-spacing: .04em
    }

    .alt {
      background: var(--ivory)
    }

    .rule {
      height: 1px;
      width: 64px;
      background: var(--gold);
      margin: 24px auto
    }

    .orn {
      display: block;
      margin: 24px auto;
      width: 150px;
      height: 18px;
      color: var(--gold)
    }

    /* hero / preloader */
    #hero {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 90px;
      background: var(--ivory);
      position: fixed;
      inset: 0;
      z-index: 20;
      transition: opacity .9s ease, visibility .9s;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-top: -30px;
    }

    .hero-monogram {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.12em;
      margin: 0 auto 28px;
      line-height: 1;
      filter: drop-shadow(0 2px 10px rgba(142, 56, 75, 0.1));
      animation: breatheMono 4.5s ease-in-out infinite;
      user-select: none;
    }

    .hero-monogram .mono-letter {
      font-family: 'Bodoni Moda', 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(3.6rem, 13vw, 5rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #8e384b;
      font-optical-sizing: auto;
    }

    .hero-monogram .mono-amp {
      font-family: 'Bodoni Moda', 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(2.4rem, 8.5vw, 3.4rem);
      font-weight: 400;
      color: #b4733c;
      margin: 0 0.04em;
      position: relative;
      top: -0.05em;
      font-optical-sizing: auto;
    }

    @keyframes breatheMono {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.025);
      }
    }

    .hero-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-family: var(--sans);
      font-size: clamp(0.78rem, 2.6vw, 0.92rem);
      font-weight: 500;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: #8e384b;
      line-height: 1.7;
    }

    .hero-names span {
      display: block;
      padding-left: .3em;
    }

    .hero-btn {
      position: absolute;
      bottom: clamp(36px, 8vh, 56px);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid #8e384b;
      color: #8e384b;
      padding: 13px 38px;
      border-radius: 999px;
      font-family: var(--sans);
      font-size: .75rem;
      letter-spacing: .26em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .3s ease;
    }

    .hero-btn:hover {
      background: #8e384b;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(142, 56, 75, 0.25);
    }

    #hero.leaving {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transition: opacity .8s ease, visibility .8s;
    }

    .arch {
      width: min(34vw, 160px, calc(22svh*.75));
      aspect-ratio: 3/4;
      border: 1px solid var(--gold);
      border-radius: 999px 999px 6px 6px;
      padding: 5px;
      margin-bottom: clamp(18px, 4svh, 32px)
    }

    .arch img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 34%;
      border-radius: 999px 999px 3px 3px
    }

    /* cover */
    #intro {
      padding-top: 0;
      padding-left: 0;
      padding-right: 0;
    }

    #intro .wrap {
      padding-left: 24px;
      padding-right: 24px;
    }

    .cover {
      width: 100%;
      max-width: 640px;
      margin: 0 auto -44px;
      aspect-ratio: 3/4;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 28%;
      transform: scale(1.03);
      transition: transform 2.6s ease;
    }

    .cover.in img {
      transform: none
    }

    @media(prefers-reduced-motion:reduce) {
      .cover img {
        transition: none;
        transform: none
      }
    }

    /* gallery */
    .gal {
      position: relative;
      max-width: min(70vw, 240px);
      margin: 0 auto;
      text-align: center;
    }

    .ph {
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(142, 56, 75, .12), 0 2px 8px rgba(0, 0, 0, .04);
      background: #ffffff;
      border: 4px solid #ffffff;
    }

    .ph img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform 2.6s ease;
    }

    .in.ph img,
    .in .ph img {
      transform: none;
    }

    .ga {
      width: 100%;
      aspect-ratio: 3/4;
      margin: 0 auto;
    }

    .ga img {
      object-position: 50% 50%;
    }

    @media(prefers-reduced-motion:reduce) {
      .ph img {
        transition: none;
        transform: none
      }
    }

    /* hero sequence */
    .seq {
      opacity: 0;
      transform: translateY(12px) scale(.98);
      animation: seq .6s ease forwards;
      animation-delay: calc(var(--i)*.16s + .05s)
    }

    @keyframes seq {
      to {
        opacity: 1;
        transform: none
      }
    }

    /* reveal */
    .r {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s ease, transform 1s ease
    }

    .r.in {
      opacity: 1;
      transform: none
    }

    .line-x {
      transform: scaleX(0);
      transition: transform 1.1s ease
    }

    .in .line-x,
    .line-x.in {
      transform: scaleX(1)
    }

    /* date */
    .daynum {
      font-family: var(--serif);
      font-size: clamp(6rem, 30vw, 10rem);
      line-height: .9;
      font-weight: 300;
      color: var(--ink)
    }

    .month {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .3em;
      margin-top: 8px;
      padding-left: .3em
    }

    .time {
      font-family: var(--serif);
      font-size: 1.6rem;
      margin-top: 8px
    }

    /* countdown */
    .cd-box {
      margin-top: 24px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(8px, 2.5vw, 16px);
      max-width: 380px;
      margin: 0 auto;
    }

    .cd-card {
      flex: 1;
      min-width: 60px;
      max-width: 82px;
      padding: clamp(10px, 2.5vw, 14px) clamp(4px, 1.5vw, 10px);
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--gold-soft);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(168, 88, 105, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform .2s ease;
    }

    .cd-card:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
    }

    .cd-val {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 6vw, 2.3rem);
      font-weight: 400;
      line-height: 1.1;
      color: var(--ink);
    }

    .cd-lbl {
      font-family: var(--sans);
      font-size: 0.65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 4px;
    }

    .cd-celebrate {
      font-family: var(--serif);
      font-size: 1.5rem;
      color: var(--gold);
      letter-spacing: .1em;
    }


    .pin {
      width: 22px;
      height: 22px;
      color: var(--gold);
      margin-bottom: 18px
    }

    .note {
      font-family: var(--serif);
      font-style: italic;
      color: var(--mute);
      font-size: 1.15rem;
      margin-top: 22px
    }

    /* families */
    .fam {
      display: grid;
      gap: 36px;
      max-width: 860px;
      margin: 32px auto 0
    }

    .fam h3 {
      font-size: 1.6rem;
      line-height: 1.3;
      margin: 0 0 14px
    }

    .fam .label {
      margin-bottom: 18px
    }

    .fam p {
      margin: 0;
      color: var(--mute);
      font-size: .95rem
    }

    .fam .sep {
      width: 1px;
      height: 56px;
      background: var(--gold-soft);
      margin: 0 auto;
      display: none
    }

    @media(min-width:760px) {
      .fam {
        grid-template-columns: 1fr 1px 1fr;
        gap: 48px;
        align-items: start
      }

      .fam .sep {
        display: block;
        height: 100%;
        min-height: 200px
      }
    }

    .comp {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      font-family: var(--serif);
      font-size: clamp(1.05rem, 4.3vw, 1.35rem);
      line-height: 1.9
    }

    .comp span {
      padding: 0 clamp(10px, 3vw, 20px);
      white-space: nowrap
    }

    .comp span+span {
      border-left: 1px solid var(--gold-soft)
    }

    .foot {
      padding: 48px 24px 56px;
      text-align: center;
      border-top: 1px solid var(--gold-soft)
    }

    .foot .serif {
      font-size: 1.4rem;
      letter-spacing: .2em
    }

    @media(prefers-reduced-motion:reduce) {

      .seq,
      .r,
      .line-x {
        animation: none;
        transition: none;
        opacity: 1;
        transform: none
      }

      html {
        scroll-behavior: auto
      }
    }
  </style>

      type="audio/mpeg">
    <source
      src="music/thattathin%20marayathu%E2%9C%A8%EF%B8%8F%20%23nostalgia%20%23lovebgm%20%23nivinpauly%20%23hearttouching.mp3"
      type="audio/mpeg">
  </audio>
  <main id="app"></main>
  <footer class="foot">
    <div class="serif" id="fmono"></div>
    <div class="small" style="margin-top:8px" id="fdate"></div>
  </footer>

  <script>
    /* ===== Central wedding data — edit here only ===== */
    const W = {
      bride: "Hannath", groom: "Roshan Rafeek", brideFirst: "Hannath", groomFirst: "Roshan", monogram: "H • R", footMono: "H & R",
      short: "Hannath & Roshan",
      function: "Nikah Ceremony",
      phrase: "Insha Allah",
      date: { full: "2 January 2027", day: "Saturday", num: "02", month: "January 2027", dots: "02 • 01 • 2027", dotted: "02.01.2027", islamic: "25 Rajab 1448" },
      time: "11:30 AM",
      venue: { name: "Grand Auditorium", place: "Kaipamangalam - 12", map: "https://www.google.com/maps/search/?api=1&query=Grand+Auditorium+Kaipamangalam" },
      tagline: "Insha Allah",
      invitationMessage: "In the name of Allah, the most beneficent and merciful.",
      quotes: [
        "In the name of Allah, the most beneficent and merciful.",
        "And among His signs is that He created for you mates from among yourselves, that you may dwell in tranquility with them, and He has put love and mercy between your hearts."
      ],
      invite: "We cordially invite your gracious presence, prayers, and blessings on the auspicious occasion of the Nikah ceremony of our children.",
      families: [
        { title: "Bride's Family", names: "Mr. Abdul Razak & Mrs. Rahmath Abdul Razak", lines: ["Kolothumparambil House", "Chentrapinni P.O."] },
        { title: "Groom's Family", names: "Mr. Rafeek K & Mrs. Nadeera Rafeek", lines: ["Kombathayil House", "Kottapadi, Guruvayur"] }
      ],
      compliments: ["Family & Friends"],
      closingLabel: "Sharing the Happiness",
      closingMessage: "Family & Friends"
    };
    const PHOTOS = { a: "image.png", b: "image-2.png" };
    /* ===== Render ===== */
    const orn = '<svg class="orn r" viewBox="0 0 150 18" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M0 9h55M95 9h55"/><circle cx="75" cy="9" r="4"/><circle cx="65" cy="9" r="2.5"/><circle cx="85" cy="9" r="2.5"/></svg>';
    const pin = '<svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>';
    const D = W.date, V = W.venue;
    document.getElementById('app').innerHTML = `
<section id="hero">
  <div class="hero-content">
    <div class="hero-monogram" aria-label="Hannath &amp; Roshan Monogram">
      <span class="mono-letter">H</span>
      <span class="mono-amp">&amp;</span>
      <span class="mono-letter">R</span>
    </div>
    <div class="hero-names">
      <span>HANNATH &amp;</span>
      <span>ROSHAN RAFEEK</span>
    </div>
  </div>
  <a class="btn hero-btn" href="#intro">Tap to open</a>
</section>

<section id="intro">
  <div class="cover r"><img src="${PHOTOS.a}" alt="Hannath and Roshan" decoding="async"></div>
  <div class="wrap">
    <p class="label r">Together with their families</p>
    <h2 class="intro-names r" aria-label="${W.bride} & ${W.groom}">
      <div class="script-line script-bride">
        <span class="script-text">${W.bride}</span>
        <span class="calligraphy-spark" aria-hidden="true"></span>
      </div>
      <div class="script-line script-amp" aria-hidden="true">
        <span class="amp">&amp;</span>
      </div>
      <div class="script-line script-groom">
        <span class="script-text">${W.groom}</span>
        <span class="calligraphy-spark" aria-hidden="true"></span>
      </div>
      <div class="flourish-wrap" aria-hidden="true">
        <svg class="calligraphy-flourish" viewBox="0 0 280 26" fill="none" preserveAspectRatio="none">
          <path class="flourish-path" d="M14,14 C65,4 105,6 140,16 C175,24 215,10 266,8" stroke="url(#goldFlourishGrad)" stroke-width="2.2" stroke-linecap="round" />
          <defs>
            <linearGradient id="goldFlourishGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(226, 179, 190, 0.2)" />
              <stop offset="35%" stop-color="rgba(168, 88, 105, 0.95)" />
              <stop offset="70%" stop-color="rgba(200, 120, 138, 0.95)" />
              <stop offset="100%" stop-color="rgba(226, 179, 190, 0.2)" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </h2>
    ${orn}
    <p class="quote r" style="font-size:1.25rem;margin-bottom:14px">“${W.invitationMessage}”</p>
    <p class="body r" style="max-width:520px;margin:0 auto;line-height:1.8;font-size:1.02rem">${W.invite}</p>
  </div>
</section>

<section class="alt"><div class="wrap">
  <p class="label r">${W.function}</p>
  <div class="daynum r">${D.num}</div>
  <div class="month r">${D.month.toUpperCase()}</div>
  <div class="day r" style="margin-top:8px">${D.day}</div>
  <div class="rule line-x r" style="margin:20px auto"></div>
  <div class="time r">${W.time}</div>
  <div class="small r" style="margin-top:6px">${D.islamic} &bull; ${W.tagline}</div>
  <div class="cd-box r">
    <p class="label" style="margin:24px 0 14px;font-size:.65rem">Counting down to forever</p>
    <div class="countdown" id="countdown">
      <div class="cd-card">
        <span class="cd-val" id="cd-days">00</span>
        <span class="cd-lbl">Days</span>
      </div>
      <div class="cd-card">
        <span class="cd-val" id="cd-hours">00</span>
        <span class="cd-lbl">Hours</span>
      </div>
      <div class="cd-card">
        <span class="cd-val" id="cd-mins">00</span>
        <span class="cd-lbl">Mins</span>
      </div>
      <div class="cd-card">
        <span class="cd-val" id="cd-secs">00</span>
        <span class="cd-lbl">Secs</span>
      </div>
    </div>
  </div>
</div></section>

<section><div class="wrap" style="max-width:560px">
  <div class="r">
    <p class="label" style="margin-bottom:14px">The venue</p>
    <div>${pin}</div>
    <h2 class="big" style="font-size:clamp(1.8rem,5.5vw,2.5rem)">${V.name}</h2>
    <p class="small" style="margin-top:8px;font-size:1rem">${V.place}</p>
    <a href="${V.map}" target="_blank" rel="noopener" style="display:inline-block;margin-top:14px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;font-size:.74rem;text-decoration:none">View on Google Maps &rarr;</a>
  </div>
</div></section>

<section class="alt"><div class="wrap" style="max-width:880px">
  <p class="quote r" style="font-size:clamp(1.15rem, 3.6vw, 1.35rem);max-width:640px;margin:0 auto 28px;line-height:1.75">“${W.quotes[1]}”</p>
  <div class="rule line-x r" style="margin:0 auto 32px"></div>
  <p class="label r">With the blessings of our families</p>
  <div class="fam">
    ${fam(W.families[0])}
    <div class="sep line-x"></div>
    ${fam(W.families[1])}
  </div>
</div></section>

<section><div class="wrap" style="max-width:320px">
  <p class="label r" style="margin-bottom:20px">Cherished Moments</p>
  <div class="gal">
    <div class="ph ga r"><img src="${PHOTOS.b}" alt="Hannath and Roshan" loading="lazy" decoding="async"></div>
  </div>
</div></section>

<section style="padding-block:clamp(56px,11vw,96px)"><div class="wrap">
  <h2 class="names r" style="font-size:clamp(2.4rem,9.5vw,3.8rem)">${W.short}</h2>
  <p class="serif r" style="font-size:1.3rem;letter-spacing:.2em;margin-top:16px">${D.dots}</p>
  <div class="rule line-x r" style="margin:24px auto"></div>
  <p class="label r" style="margin-bottom:12px">${W.closingLabel}</p>
  <div class="comp r"><span>${W.closingMessage}</span></div>
  <p class="small r" style="margin-top:22px;letter-spacing:.12em">With love and blessings</p>
  ${orn}
</div></section>`;
    function fam(f) {
      return `<div class="r">
  <p class="label">${f.title}</p>
  <h3>${f.names}</h3>
  <p>${f.lines.join('<br>')}</p>
</div>` }
    document.getElementById('fmono').textContent = W.footMono;
    document.getElementById('fdate').textContent = D.dotted;
    /* ===== Countdown Timer ===== */
    const targetDate = new Date("2027-01-02T11:30:00+05:30").getTime();
    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      const daysEl = document.getElementById('cd-days');
      const hoursEl = document.getElementById('cd-hours');
      const minsEl = document.getElementById('cd-mins');
      const secsEl = document.getElementById('cd-secs');

      if (!daysEl) return;

      if (diff <= 0) {
        const cdContainer = document.getElementById('countdown');
        if (cdContainer) {
          cdContainer.innerHTML = '<div class="cd-celebrate">Celebrating Together Today!</div>';
        }
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);

      daysEl.textContent = String(days).padStart(2, '0');
      hoursEl.textContent = String(hours).padStart(2, '0');
      minsEl.textContent = String(mins).padStart(2, '0');
      secsEl.textContent = String(secs).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    /* ===== Scroll reveal ===== */
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .15, rootMargin: '0px 0px -6% 0px' });

    /* ===== Prelude: guest taps Open Invitation to enter ===== */
    history.scrollRestoration = 'manual'; scrollTo(0, 0);
    document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
    let opened = false;
    function openInvite() {
      if (opened) return; opened = true;
      document.documentElement.style.overflow = ''; document.body.style.overflow = '';
      scrollTo(0, 0);
      const hero = document.getElementById('hero');
      if (hero) {
        hero.classList.add('leaving');
        setTimeout(() => {
          hero.style.display = 'none';
        }, 850);
      }
      document.querySelectorAll('.r').forEach(el => io.observe(el));
      playAudio();
      setTimeout(() => {
        const inames = document.querySelector('.intro-names');
        if (inames) inames.classList.add('in');
      }, 450);
    }
    const heroBtn = document.querySelector('#hero .btn');
    if (heroBtn) {
      heroBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); openInvite(); });
      heroBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); openInvite(); });
    }
    const heroEl = document.getElementById('hero');
    if (heroEl) {
      heroEl.addEventListener('click', () => openInvite());
      heroEl.addEventListener('touchend', () => openInvite(), { passive: true });
    }

    /* Safety fallback: restore scroll if reopened or restored from cache */
    window.addEventListener('pageshow', e => {
      if (e.persisted || opened) {
        openInvite();
      }
    });

    /* ===== Background Music Playback ===== */
    const audio = document.getElementById('wedding-audio');

    function playAudio() {
      if (!audio) return;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log("Audio waiting for user gesture:", err);
          const resume = () => {
            audio.play().catch(() => { });
            window.removeEventListener('click', resume);
            window.removeEventListener('touchstart', resume);
          };
          window.addEventListener('click', resume, { once: true });
          window.addEventListener('touchstart', resume, { once: true });
        });
      }
    }
  </script>
</body>

</html>
